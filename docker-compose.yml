services:
  db:
    # Postgres 16 com a extensão pgvector (busca semântica do assistente).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_nobre
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d crm_nobre']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/crm_nobre
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      TZ_OPERACAO: America/Sao_Paulo
      REFERENCE_DATE: ${REFERENCE_DATE:-2026-10-15}
      SEED_ON_START: ${SEED_ON_START:-true}
      # Opcional: sem a chave, o CRM funciona e o assistente fica desligado.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  db-data:
